services:
  postgres:
    image: postgres:17-alpine
    container_name: queueless-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: queueless
      POSTGRES_USER: queueless
      POSTGRES_PASSWORD: queueless_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - queueless_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queueless -d queueless"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  queueless_postgres_data:
